<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NOCKOUT Protocol Demo Reset</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 20%, rgba(83, 228, 255, 0.18), transparent 34%),
          #05070b;
        color: #f5f8ff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(560px, 100%);
        padding: 28px;
        border: 1px solid rgba(234, 242, 255, 0.18);
        border-radius: 8px;
        background: rgba(8, 13, 22, 0.78);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.42);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 14px;
        color: #aab8ca;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        padding: 0 14px;
        border-radius: 8px;
        background: #53e4ff;
        color: #041018;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>NOCKOUT Protocol Demo Reset</h1>
      <p>이전 WebGL 데모 빌드는 제거됐습니다. 지금은 새 와이어프레임 방향으로 다시 진행합니다.</p>
      <a href="https://onlyai61.github.io/nockout-protocol/">새 와이어프레임 보기</a>
    </main>
  </body>
</html>
